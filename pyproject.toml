[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2apay-io"
version = "0.1.0"
description = "Pay-per-call AI query and persistent memory for autonomous agents, via a2apay.io"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
paid = ["eth-account>=0.10"]
mcp = ["mcp>=2.0"]

[tool.setuptools]
packages = ["a2apay"]
